<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouton Jump to Top</title>
    <style>
        /* ===== STYLE DU BOUTON ===== */
        /* On cache le bouton par défaut (il apparaîtra quand on scroll) */
        #jumpToTopBtn {
            display: none; /* Masqué au début */
            position: fixed; /* Position fixe pour qu'il reste visible même en scrollant */
            bottom: 20px; /* 20px depuis le bas de l'écran */
            right: 20px; /* 20px depuis la droite de l'écran */
            width: 50px; /* Largeur du bouton */
            height: 50px; /* Hauteur du bouton */
            border: none; /* Pas de bordure */
            border-radius: 50%; /* Bordure arrondie pour un cercle */
            background-color: #007BFF; /* Couleur de fond bleue */
            color: white; /* Texte en blanc */
            cursor: pointer; /* Curseur en forme de main au survol */
            font-size: 20px; /* Taille du texte (icône) */
            z-index: 1000; /* Assure que le bouton reste au-dessus des autres éléments */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); /* Ombre légère pour un effet 3D */
            transition: background-color 0.3s; /* Animation douce pour le changement de couleur */
        }

        /* Effet au survol du bouton */
        #jumpToTopBtn:hover {
            background-color: #0056b3; /* Couleur plus foncée au survol */
        }

        /* ===== STYLE POUR LA DÉMO ===== */
        /* Ajout de contenu pour pouvoir scroller et tester le bouton */
        body {
            font-family: Arial, sans-serif;
            height: 2000px; /* Hauteur artificielle pour permettre le scroll */
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>
<!-- Contenu de la page (pour la démo) -->
<h1>Bienvenue sur mon site, Kyun !</h1>
<p>Fais défiler la page vers le bas pour voir le bouton apparaître...</p>

<!-- ===== BOUTON JUMP TO TOP ===== -->
<!-- Le bouton est un simple bouton HTML avec un symbole "↑" -->
<button id="jumpToTopBtn" title="Retour en haut">↑</button>

<script>
    // ===== RÉCUPÉRATION DU BOUTON DANS LE DOM =====
    // On récupère le bouton dans une variable pour pouvoir l'utiliser en JS
    const jumpToTopBtn = document.getElementById("jumpToTopBtn");

    // ===== FONCTION POUR FAIRE DÉFILER VERS LE HAUT =====
    // Cette fonction utilise la méthode window.scrollTo pour remonter en haut de la page
    // Le comportement "smooth" permet un défilement fluide
    function scrollToTop() {
        window.scrollTo({
            top: 0, // Position verticale : 0 (tout en haut)
            behavior: "smooth" // Animation fluide
        });
    }

    // ===== AFFICHER/MASQUER LE BOUTON EN FONCTION DU SCROLL =====
    // On écoute l'événement "scroll" sur la fenêtre
    window.addEventListener("scroll", function() {
        // Si l'utilisateur a scrolled de plus de 100px, on affiche le bouton
        if (window.pageYOffset > 100) {
            jumpToTopBtn.style.display = "block"; // Affiche le bouton
        } else {
            jumpToTopBtn.style.display = "none"; // Masque le bouton
        }
    });

    // ===== ÉCOUTEUR D'ÉVÉNEMENT POUR LE CLIQUE SUR LE BOUTON =====
    // Quand on clique sur le bouton, on appelle la fonction scrollToTop
    jumpToTopBtn.addEventListener("click", scrollToTop);
</script>
</body>
</html>
