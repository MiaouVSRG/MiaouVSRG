<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link href="/css/login.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?display=swap&family=Fredoka+One:ital,wght@0,400;1,400&family=Comfortaa:ital,wght@0,600;0,700;1,600;1,700"
          rel="stylesheet" type="text/css" />

</head>

<body>

<img class="catjump" src="/assets/images/catjump.gif">


<div class="loginbox">
    <div class="loginspan">
        welcome!
    </div>

    <div class="logindescription">
        login to an existing account or create yours :3
    </div>

<form class="loginwrite" id="userform">
        <span>username:</span>
    <input type="text" class="usernamebox" id="username" required />
        <span>password:</span>
    <input type="password" class="passwordbox" id="password" required />

    <div class="registerorlogin">
            <button value="register" class="registerbutton" id="registerButton">register</button>
            <button value="login" class="loginbutton" id="loginButton">login</button>
    </div>
</form>



    <div class="line"></div>

    <div class="logindescription">
        or connect with:
    </div>

    <div class="discordbox">
        <img class="discordimg" id="discordlogin" src="/assets/images/gallery01/1df64c12.png">
    </div>



</div>

<img class="catjump" src="/assets/images/catjump.gif">


</body>

<script src="/js/login.js"></script>

</html>
